hesion matter, ForzaSeal outperforms DOWSIL on the application."], ["to the transportation manufacturer", "VORAMER polyurethane foam adhesive is the standard for composite panel lamination in trailer manufacturing. Forza H663A PUR hot melt covers the same reactive hot melt panel lamination application \u2014 crosslinks on cure, temperature stable, Iowa-made direct. No Dow distribution markup."], ["to the distributor", "Dow adhesive and sealant products move through a $43B global chemicals company cost structure \u2014 that overhead is in the price. On equivalent application chemistry, Forza gives you better margin with no Dow parent overhead. And Forza adds the spray adhesive category Dow cannot supply alongside the sealant."]], "seeds": ["DOWSIL silicone is the gold standard on glass and non-porous metal. But silicone has real chemistry limitations: it doesn't bond to concrete or masonry without a primer, it can't be painted over cleanly, and low-molecular-weight silicone compounds bleed out over time and contaminate adjacent surfaces. ForzaSeal OS-series hybrid MS polymer: better adhesion to porous substrates, fully paintable, no silicone bleed, same UV and weather resistance.", "Dow is a $43B global materials science company that makes semiconductor materials, packaging films, and water treatment chemicals in addition to adhesives and sealants. Forza makes nothing but bonding and sealing products. When a contractor has a specific bonding application question, Forza's team has answered that exact question before \u2014 today.", "Dow's products move through a global chemicals distribution chain with commodity pricing volatility. Forza manufactures in Council Bluffs, Iowa \u2014 direct from the factory, domestic supply chain, no global chemical market exposure in the price. On equivalent MS polymer chemistry, the margin structure for the distributor is materially different."], "landmines": [["For applications where DOWSIL silicone is currently used on porous substrates like concrete, masonry, or coated metals \u2014 is a primer step required, and has adhesion failure been an issue without it?", "DOWSIL silicone requires a primer for reliable adhesion to porous substrates. ForzaSeal MS polymer bonds to concrete and masonry without primer. Fewer application steps, fewer failure points, same weather resistance."], ["On DOWSIL silicone applications where the sealant gets painted over \u2014 has silicone bleed-through or paint adhesion failure been an issue on any projects?", "Silicone chemistry releases low-molecular-weight silicone compounds over time that prevent paint adhesion and contaminate adjacent surfaces. ForzaSeal MS polymer has no silicone content \u2014 fully paintable, no bleed, compatible with coatings applied after cure."], ["For your VORAMER composite panel lamination \u2014 is the hot melt chemistry reactive PUR or standard PU, and does the temperature performance difference matter for your finished panels?", "Standard PU adhesives soften above 60\u00b0C and weaken in cold environments. VORAMER and Forza H663A are reactive PUR hot melts \u2014 they crosslink on cure, maintaining bond strength across temperature extremes. If the panels ever see heat or cold in service, the chemistry distinction matters."], ["On Dow adhesive and sealant pricing \u2014 do you know how much of the price reflects Dow's global commodity chemical overhead versus actual formulation cost?", "Dow is a $43B global chemicals company. Pricing reflects global manufacturing, multi-tier US distribution, and commodity chemical market fluctuations. Forza is a direct Iowa manufacturer. On equivalent MS polymer chemistry, the cost structure difference is meaningful."], ["If Dow's global supply chain gets disrupted \u2014 commodity pricing spike, manufacturing issue, export restriction \u2014 what's your backup for the sealant and adhesive SKUs you're sourcing from them?", "Dow manufactures globally with exposure to commodity chemical price swings and international supply chain variables. Forza manufactures in Council Bluffs, Iowa \u2014 one domestic plant, no import exposure, no commodity chemical pricing volatility. Worth qualifying a domestic alternative before you need it."]], "objections": [["DOWSIL is the gold standard for silicone sealant", "DOWSIL silicone excels on non-porous substrates like glass and aluminum where paintability isn't required. Where paintability matters or where the substrate is concrete, masonry, or coated metal \u2014 ForzaSeal hybrid MS polymer outperforms silicone on adhesion without primer and is fully paintable. The application determines which chemistry wins."], ["Dow has much bigger R&D investment", "Dow's R&D covers semiconductor materials, packaging films, and water treatment. Forza's R&D covers adhesives, sealants, tapes, and cleaners. The team size doesn't determine who has the right product for your application \u2014 the TDS does."], ["Dow supply chain is very stable", "Dow manufactures globally with commodity chemical price volatility built into every product. Forza manufactures in Council Bluffs, Iowa \u2014 one plant, domestic supply chain, no global commodity chemical price fluctuation in the pricing."], ["DOWSIL is approved in our process", "DOWSIL approval covers silicone chemistry. For MS polymer applications \u2014 porous substrates, paintable applications, enclosed spaces without silicone VOC concerns \u2014 ForzaSeal is a different chemistry class with different application advantages. It's an addition where silicone falls short, not a displacement of approved silicone."]], "crosswalk": [{"sku": "DOWSIL 795 Silicone Building Sealant", "app": "Neutral-cure medium-modulus silicone weatherseal/structural", "ind": "OA13"}, {"sku": "DOWSIL Contractors Weatherproofing Sealant", "app": "Medium modulus moisture-cure weatherproofing sealant", "ind": "OA4"}, {"sku": "DOWSIL 732 Multi-Purpose Silicone", "app": "Acetoxy-cure multi-purpose silicone sealant", "ind": "OA13"}, {"sku": "DOWSIL 734 Flowable Sealant", "app": "Flowable 1-part silicone for sealing and bonding", "ind": "OA12"}, {"sku": "DOWSIL 999-A Silicone Sealant", "app": "All-purpose acetoxy silicone construction sealant", "ind": "OA13"}, {"sku": "VORAMER Industrial Adhesive", "app": "PU foam adhesive manufactured housing/construction panel bonding", "ind": "R221 / R320"}, {"sku": "VORAMER MR1006 / MR1010", "app": "Polyurethane foam adhesive RV/modular construction panels", "ind": "R221 / R320"}, {"sku": "DOWSIL 3145 RTV Mil-Spec", "app": "MIL-SPEC silicone RTV adhesive/sealant industrial", "ind": "OA13"}, {"sku": "DOWSIL 999-B Silicone", "app": "Acetoxy silicone general industrial sealant", "ind": "OA12"}, {"sku": "ROBOND Acrylic Polymer Sealant", "app": "Acrylic polymer weatherability sealant/caulk", "ind": "OS2"}], "wins": ["ForzaSeal MS polymer: paintable, bonds to concrete without primer, no silicone bleed \u2014 outperforms DOWSIL silicone on porous substrates", "Forza H663A PUR hot melt: crosslinks on cure, temperature stable \u2014 advantages over DOWSIL EVA-based alternatives on temperature-exposed applications", "Direct manufacturer pricing vs. $43B global chemical company distribution markup on equivalent chemistry", "Iowa-made domestic supply chain vs. Dow global manufacturing with commodity price volatility exposure", "Adhesive specialist vs. $43B commodity chemicals conglomerate \u2014 Forza's team knows bonding applications"], "moats": ["DOWSIL silicone chemistry \u2014 world-leading R&D, 7,000+ product portfolio", "VORAMER deeply embedded in manufactured housing and modular construction OEM specs", "Global scale and manufacturing \u2014 30 countries, 36,000 employees", "DOWSIL structural glazing silicones \u2014 specced into major curtainwall projects worldwide", "Dow's materials science integration \u2014 silicone + polyurethane + acrylic in one supplier"]}, {"id": "durodyne", "name": "Durodyne (Duro Dyne)", "brands": "Duro Dyne / Air Seal / Sure-Grip / Roto Bonder / Foil-Grip", "hq": "Bay Shore, NY", "rev": "Private; est. <$100M (HVAC accessories + adhesives combined)", "threat": "LOW", "pitch": "Duro Dyne has gone through two ownership changes since 2021. NSI Industries acquired Duro Dyne from Sentinel Capital Partners in November 2021. Lennox International (NYSE: LII) then acquired NSI's entire HVAC division \u2014 including Duro Dyne and the Supco brand \u2014 from NSI on October 16, 2025 for $545 million total. Duro Dyne and Supco combined represent approximately $225M in annual revenue. Lennox is a $5B+ HVAC equipment company headquartered in Dallas; CEO Alok Maskara positioned the acquisition as a 'full HVAC value chain' play \u2014 equipment to installation to service to parts. Duro Dyne's duct sealant and liner adhesive line is now a parts-and-supplies sub-category inside a major HVAC equipment company whose core business is air handlers, furnaces, and heat pumps.", "msgs": [["To the HVAC Sheet Metal Contractor", "Duro Dyne's duct sealers and liner adhesives come with the rest of the Duro Dyne sheet metal accessories on the same order. For the adhesive and sealant portion specifically, Forza R-series and RC-series offer purpose-built insulation and HVAC chemistry at direct pricing."], ["To the HVAC Distributor", "Duro Dyne's sealant and adhesive line is now owned by Lennox International \u2014 a $5B HVAC equipment company. Lennox ownership means the adhesive line's pricing and distribution strategy serves Lennox's goals, not yours. Forza is a direct Iowa manufacturer \u2014 the margin structure is better and the relationship doesn't change when Lennox decides to optimize."], ["To the Insulation Contractor", "Duro Dyne liner adhesives are the standard in the HVAC duct liner market. Forza R160 and R221 cover the same duct liner and duct sealant applications as part of a complete insulation system from a direct manufacturer."]], "seeds": ["Duro Dyne's ownership history in four years: Sentinel Capital Partners sold it to NSI Industries in November 2021. Lennox International then bought NSI's entire HVAC division \u2014 Duro Dyne and Supco together \u2014 for $545 million in October 2025. That's two ownership changes in four years, and the second one landed Duro Dyne inside a $5 billion HVAC equipment company. Lennox CEO Alok Maskara's public framing was explicit: this is about completing 'the full HVAC value chain' from equipment to parts. Duro Dyne's duct sealant and liner adhesive is now a small line inside a massive equipment company's parts-and-supplies portfolio. When Lennox has a capital allocation decision to make, it goes to compressors and heat exchangers, not to adhesive formulation.", "Duro Dyne's primary business has always been HVAC sheet metal accessories \u2014 dampers, fasteners, cable hanging systems, access doors, zone control. Their duct sealant and liner adhesive products exist because HVAC contractors buy both from the same distributor on the same order. The adhesive rides on the accessories PO, not on its own merit. Forza's Insulation vertical is purpose-built for HVAC and mechanical insulation bonding and sealing \u2014 full ASTM peel and shear data on the TDS, direct manufacturer pricing, and a technical team that handles adhesive questions only.", "DuroSeal is a legitimate duct sealant \u2014 UL 181 listed, SMACNA approved, zero VOC in wet and cured state. That specification position is real and Forza respects it. The entry point isn't the duct sealant \u2014 it's the insulation spray adhesive and bonding tape that Duro Dyne doesn't compete in. Forza RC-series canister spray adhesive and Forza insulation tape have no Duro Dyne equivalent. Win the spray adhesive and tape first, then earn the sealant conversation when Lennox ownership creates the pricing or supply opening. [ROB REVIEW \u2014 Duro Dyne sells NPAB/NPAC canister sprays; reposition on system breadth and vertical coverage, not exclusivity]"], "landmines": [["Duro Dyne is now owned by Lennox International \u2014 a $5B HVAC equipment company. For the duct sealant and liner adhesive portion of your Duro Dyne order, do you know whether Lennox is investing in that product line or managing it as a secondary category?", "Lennox acquired Duro Dyne for its sheet metal accessories business \u2014 dampers, fasteners, hanging systems. The adhesive and sealant line came with the acquisition but is not the strategic reason Lennox bought it. Equipment companies that acquire accessory manufacturers typically maintain the adhesive line for distribution continuity but don't invest in it. Product development, technical support, and pricing optimization go to the equipment side. For distributors who have built their HVAC insulation program around Duro Dyne adhesives, that investment gap is worth watching."], ["For the duct liner spray adhesive and insulation bonding tape your HVAC contractors need on the same job as DuroSeal \u2014 is Duro Dyne supplying those, or are you managing separate accounts?", "DuroSeal is Duro Dyne's primary sealant product. Their spray adhesive line (Roto Bonder liner adhesive) is narrower and their tape line is HVAC gasketing, not bonding tape for insulation systems. An HVAC contractor running DuroSeal for duct sealing still needs canister spray adhesive and insulation bonding tape from other sources. Forza RC-series and insulation tape fill exactly those gaps \u2014 and under Lennox ownership, Duro Dyne's ability to expand into those categories is lower, not higher."], ["Duro Dyne's accessories and sealant come on the same PO \u2014 it's convenient. But is the sealant chemistry being selected because it's the right product for the application, or because it's bundled with the dampers and fasteners?", "The convenience bundling is Duro Dyne's distribution moat \u2014 the sealant rides on the accessories order and nobody asks whether the chemistry is optimal. That's fine for standard duct sealing applications. On applications where coverage rate, bond strength, or VOC compliance matter \u2014 Forza R221 is a purpose-built water-based duct sealant with full ASTM data on the TDS. The chemistry conversation is worth having separate from the accessories convenience argument."]], "objections": [["Duro Dyne duct sealer comes with the rest of our accessories order \u2014 it's convenient", "The bundle convenience is real and worth keeping where the chemistry is adequate. The question is whether you're optimizing for convenience or for margin and product performance on the adhesive portion. Forza R221 is purpose-built water-based duct sealant at direct manufacturer pricing \u2014 the chemistry comparison is worth running. And Forza RC-series spray adhesive and insulation tape have no Duro Dyne equivalent, so those categories are open regardless of who has the sealant."], ["Air Seal is the field standard for our sheet metal contractors", "Air Seal's HVAC field position is legitimate \u2014 decades of contractor familiarity in the sheet metal channel. Forza doesn't fight Air Seal on brand recognition. The entry is the spray adhesive and bonding tape categories that Duro Dyne doesn't cover. Win those first. When Lennox ownership starts affecting Air Seal pricing or availability, Forza is already in the account on the adhesive and tape side."], ["Lennox buying Duro Dyne makes them stronger, not weaker", "Lennox's distribution reach could expand Duro Dyne's access \u2014 that's a legitimate concern in the equipment channel. In the adhesive and sealant channel specifically, equipment company ownership typically means less product investment, not more. Lennox's R&D and sales focus go to air handlers and furnaces. Forza's entire operation is adhesives, sealants, tapes, and cleaners. For a distributor who needs technical support and product development in the insulation bonding category, that focus difference matters."]], "crosswalk": [{"sku": "Duro Dyne Air Seal Water-Based Duct Sealer", "app": "Water-based duct sealant UL Listed commercial/residential", "ind": "R221"}, {"sku": "Duro Dyne Sure-Grip 404 Solvent Duct Sealer", "app": "Solvent-based synthetic rubber duct sealant (legacy)", "ind": "R221"}, {"sku": "Duro Dyne Zero VOC Duct Sealer", "app": "Zero-VOC premium water-based UL Listed duct sealant", "ind": "R221"}, {"sku": "Duro Dyne Roto Bonder Liner Adhesive", "app": "Duct liner spray adhesive for HVAC duct liner bonding", "ind": "R160"}, {"sku": "Duro Dyne Foil-Grip Tape/Sealant", "app": "UL 181B-FX pressure sensitive duct sealing tape/sealant", "ind": "T305 / R-T600"}, {"sku": "Duro Dyne Insulation Adhesive", "app": "Water-based adhesive bonding insulation board duct", "ind": "R160"}], "wins": ["Forza direct Iowa manufacturer vs. Duro Dyne now part of $5B Lennox International HVAC equipment company", "No Lennox integration uncertainty \u2014 Forza pricing and distribution relationship is stable and direct", "Forza purpose-built insulation adhesive: full ASTM peel/shear data on TDS vs. hardware company secondary product", "Forza bonding tape purpose-built for insulation vertical \u2014 Duro Dyne tape is HVAC gasketing only", "Forza canister system breadth \u2014 IC/MC/TC/RC series covers industrial, marine, transportation, and insulation verticals in multiple canister sizes; Duro Dyne's NPAB/NPAC line is HVAC-focused and single-channel"], "moats": ["DuroSeal duct sealant UL 181 listed, SMACNA approved \u2014 specced into commercial HVAC duct work", "Sheet metal accessory bundle (dampers, fasteners, hangers) \u2014 adhesive rides on hardware PO", "70-year sheet metal contractor loyalty \u2014 Lennox acquisition may strengthen or disrupt this", "Lennox distribution network now behind Duro Dyne \u2014 potentially expanding reach", "Air Seal brand recognition in sheet metal channels for duct sealing", "Duro Dyne NPAB40/NPAB187/NPAC40 canister spray adhesives \u2014 real pressurized canister line including CARB-compliant variants (CCASA-WFTC, CCDTWAC); do not claim no canister competition"]}, {"id": "gesealants", "name": "GE Sealants", "brands": "GE Sealants / Momentive / SilPruf / SCS Series / SWS", "hq": "Niskayuna, NY (Momentive) / Brand licensed for retail", "rev": "Momentive ~$6.5B (all silicones); GE Sealants retail brand est. <$200M", "threat": "MOD", "pitch": "GE Sealants is a licensed brand \u2014 the timeline: GE sold its silicones division to Apollo Global Management in 2006 for $3.2 billion. Apollo's Momentive Performance Materials entered bankruptcy in 2014 due to debt. In 2019, KCC Corporation (South Korea), Wonik QnC, and SJL Partners acquired Momentive for $3.1 billion. KCC became majority shareholder in 2020. On May 14, 2024, KCC completed 100% acquisition of Momentive by buying out final minority shareholder SJL Partners. Momentive is the exclusive global licensee of the GE Sealants brand \u2014 KCC Corporation of Korea now owns 100% of the company that licenses the GE name. Momentive also sold its Consumer Sealants business to Henkel during its restructuring, further separating the GE brand from any operational connection to General Electric. The GE name on the tube has had no connection to GE's engineering or manufacturing since 2006 \u2014 nearly 20 years.", "msgs": [["To the Contractor", "GE SCS1000 and Tremsil-type silicones are the jobsite standard for glazing and window sealing. Forza OA13 and OA4 cover the same sealant applications at direct pricing with the added benefit of a single-source for adhesive and tape."], ["To the Distributor", "GE Sealants brand sells on name recognition \u2014 Momentive licenses the GE name for the retail and professional channel. Forza is a direct Iowa manufacturer across a broader product line. Better margin structure without paying for a licensed brand name your industrial customers don't actually specify."], ["To the Construction Specifier", "SilPruf SCS2000 is the glazing benchmark. For non-structural sealant applications, Forza OA4 and OS35 cover the same joint and perimeter sealing needs at direct manufacturer pricing."]], "seeds": ["The GE name on GE Sealants has a specific legal history worth knowing. GE sold its silicones division to Apollo Global Management in 2006. Apollo's Momentive Performance Materials went through bankruptcy in 2014 due to debt. KCC Corporation of South Korea acquired Momentive in 2019 and completed 100% ownership in May 2024. Momentive is the exclusive global licensee of the GE brand for silicone sealants \u2014 meaning the company that owns the rights to put GE on the tube is a Korean chemical conglomerate that has changed hands three times in 20 years and been through bankruptcy once. A contractor who specs GE because they trust General Electric's engineering standards is trusting a brand relationship that ended in 2006.", "GE Sealants is a silicone-only product line \u2014 acetoxy cure, neutral cure, structural glazing. No adhesive, no tape, no polyurethane sealant, no spray system. A contractor who specs GE SCS silicone for a window sealing application still needs a spray adhesive, a bonding tape, and a cleaner for the same job. Forza covers all four from one Iowa manufacturer. The single-source conversation is easy to have even on accounts where GE has the silicone spec \u2014 because GE cannot follow Forza into adhesive, tape, or cleaner on the same job.", "GE SilPruf structural glazing silicone is their strongest product and their most durable spec position \u2014 deeply written into curtainwall and architectural glazing systems. Forza doesn't compete there. But structural glazing is a fraction of the applications where GE appears on a distributor's shelf. On joint sealing, perimeter sealant, HVAC gasketing, and industrial sealing where paintability, porous substrate adhesion, or single-source supply matter \u2014 Forza's hybrid MS polymer and silicone sealants cover the same applications without the licensed-brand premium."], "landmines": [["The GE brand on GE Sealants \u2014 do your contractors know that GE sold its silicone division in 2006 and the GE name is now licensed to a Korean chemical company? Is the brand driving the specification or is it the chemistry?", "GE sold its silicone operations to Apollo Global Management in 2006, which became Momentive Performance Materials. KCC Corporation (Korea) acquired Momentive in 2024. The GE Sealants brand is a license agreement between Momentive and GE. Contractors who specify GE Sealants based on trust in General Electric's engineering standards are trusting a brand relationship that ended nearly 20 years ago. The chemistry underneath is good \u2014 but if the spec is brand-driven, it's worth asking which brand is actually behind it."], ["For the applications where GE silicone sealant is currently used \u2014 does the spec require silicone chemistry specifically, or does it call for a weatherproof elastomeric sealant with UV stability and specific elongation values? Because if it's performance-based, Forza's hybrid MS polymer meets the same criteria and is paintable.", "GE silicone sealants are excellent on non-porous substrates \u2014 glass, aluminum, anodized metals \u2014 where paintability isn't required. On porous substrates (concrete, masonry, coated metals) or where the joint will be painted after sealing, silicone chemistry creates problems: poor adhesion without primer, paint adhesion failure, silicone bleed contaminating adjacent surfaces. Forza's hybrid MS polymer bonds to porous substrates without primer, is fully paintable within 24 hours, and has no silicone bleed. Where those properties matter, it's a better chemistry match than GE silicone."], ["For the adhesive, tape, and cleaner your contractors need alongside GE sealant on the same job \u2014 is Momentive supplying those, or are you managing separate supplier accounts?", "GE Sealants is a silicone sealant line. No adhesive, no tape, no cleaner. Every contractor using GE SCS sealant for perimeter sealing is sourcing spray adhesive, bonding tape, and surface cleaner from at least two other suppliers. Forza covers all four from one Iowa manufacturer on one PO. The single-source argument doesn't require displacing GE on the silicone spec \u2014 it just requires adding Forza alongside it for the categories GE cannot supply."]], "objections": [["GE Silicone is the spec on this job", "If the spec calls for GE SilPruf by name on a structural glazing application, that's a locked position and Forza doesn't compete there. On non-structural sealant specs \u2014 joint sealing, perimeter sealing, HVAC gasketing \u2014 pull the spec language. If it's ASTM C920 performance class with 'or approved equal,' Forza OA13 and OS35 cover the same silicone applications. And regardless of who has the sealant spec, the adhesive, tape, and cleaner categories on the same job are open."], ["We trust the GE name", "The trust is in the right product category \u2014 GE silicone has a long field history in glazing and sealing. The brand connection to General Electric ended in 2006. The chemistry behind the tube today is Momentive Performance Materials, owned by KCC Corporation of Korea. For a contractor who trusts the performance track record, that history is worth something. For a contractor who trusts the GE name because they trust GE as a company \u2014 that connection hasn't been accurate for nearly 20 years."], ["SilPruf is the only option for our glazing specs", "SilPruf's structural glazing position is legitimate and Forza doesn't have a direct equivalent \u2014 that's the right call to leave with GE. On every application that isn't structural curtainwall glazing \u2014 perimeter sealing, joint sealing, HVAC gasketing, industrial sealing where paintability matters \u2014 Forza OA13 and OA4 cover the same silicone and hybrid applications. Win the non-glazing square footage on the same job."]], "crosswalk": [{"sku": "GE SCS1000 / SCS1001", "app": "General purpose acetoxy silicone", "ind": "OA13"}, {"sku": "GE SCS2000 / SilPruf", "app": "High-performance weatherseal silicone", "ind": "OA13"}, {"sku": "GE SWS", "app": "Neutral cure economical silicone", "ind": "OS2"}, {"sku": "GE Advanced Silicone 2", "app": "Kitchen & bath 100% silicone", "ind": "OA12"}, {"sku": "GE Concrete Silicone 2", "app": "Concrete and masonry sealant", "ind": "OS35"}, {"sku": "GE Metal Silicone 2", "app": "Metal and exterior applications", "ind": "OA13"}, {"sku": "GE Supreme Kitchen & Bath", "app": "Premium silicone bath sealant", "ind": "OA12"}, {"sku": "GE Window & Door Silicone", "app": "Weatherproof window/door sealant", "ind": "OS2"}, {"sku": "GE Paintable Hybrid Sealant", "app": "Paintable hybrid kitchen/bath", "ind": "OA4"}, {"sku": "SilPruf NB SCS9000", "app": "Low dirt-pickup silicone", "ind": "OA13"}], "wins": ["Direct manufacturer pricing vs GE licensed brand pricing", "Forza broader product line: adhesive + sealant + tape on one account", "No Forza structural glazing competition \u2014 Forza wins on non-structural sealant", "GE brand is licensed (Momentive/KCC) \u2014 GE equity story is weakened", "Forza PU and SMP sealants cover applications GE silicone cannot"], "moats": ["SilPruf SCS2000 structural glazing \u2014 deeply specced and Forza has no structural glazing equivalent", "GE name recognition in silicone \u2014 strongest brand equity in residential sealant", "SCS Series acetoxy-cure chemistry is the glazing contractor default"]}, {"id": "henkel", "name": "Henkel", "brands": "Loctite / Teroson / Technomelt / Bonderite", "hq": "Dusseldorf, Germany", "rev": "$11B+ adhesives", "threat": "HIGH", "pitch": "Henkel is a $20B+ German conglomerate with five industrial adhesive brands: Loctite, Technomelt, Teroson, Bonderite, and Aquence. Teroson serves OEM transportation with tapes, foams, and sealants. Loctite covers structural adhesives, threadlockers, CA, and hot melts. Forza R519 matches Loctite 2-part MMA chemistry at direct Iowa pricing. Forza has industrial cleaner and canister spray categories Henkel cannot supply.", "msgs": [["to the industrial contractor", "Loctite H8000 is a proven 2-part methacrylate. Forza R519 is a 2-part structural acrylic in the same chemistry class \u2014 metals, plastics, composites \u2014 Iowa-made, direct manufacturer pricing, full ASTM peel and tensile data on the TDS. And Forza picks up the phone with the chemist who made it."], ["to the composite/panel manufacturer", "Standard EVA hot melt softens above 60\u00b0C and weakens in cold. Forza H663A and H664A are Forza-manufactured PUR reactive hot melts \u2014 they crosslink on cure and maintain bond strength across temperature extremes. That distinction matters on any panel that sees heat or cold in service."], ["to the distributor", "You're selling Loctite at margins that include Henkel's German parent overhead and US distribution markup \u2014 that overhead doesn't go to you. Forza is a direct Iowa manufacturer with no $20B conglomerate cost structure between the factory and your order. Cleaner pricing, better margin, and Forza covers tape and cleaner categories Henkel cannot."]], "objections": [["Loctite has a proven track record", "Loctite's reputation is earned. Forza R519 is a 2-part structural acrylic in the same chemistry class \u2014 with full ASTM peel and tensile data and direct Iowa manufacturer pricing. Get us on a trial order and we'll put the TDS comparison in writing."], ["We're already on Henkel's pricing program", "Pricing programs lock in spend, not margin. Forza's direct manufacturer pricing has no German parent overhead or US distribution markup built in. The margin difference on equivalent chemistry is worth a conversation before your next renewal."], ["Henkel supports our specs", "Spec support is valuable \u2014 and Forza's chemist in Council Bluffs answers the phone directly. No 800 number, no routing through a $20B conglomerate's call center. Same technical support, simpler relationship, better pricing structure."], ["We use Technomelt for our hot melt applications", "Standard Technomelt EVA grades soften above 60\u00b0C. Forza H663A and H664A are Forza-manufactured PUR reactive hot melts \u2014 they crosslink on cure and hold through temperature cycles that soften EVA. If heat exposure is part of the application, that's a spec difference worth looking at."]], "seeds": ["Loctite's 2-part methacrylate chemistry in H8000 is the same chemistry class as Forza R519. The performance is comparable \u2014 and Forza is a direct Iowa manufacturer with no $20B German parent overhead in the price. The margin difference on equivalent chemistry is worth calculating before the next Loctite contract renewal.", "Henkel is a $20B conglomerate. Their industrial adhesive rep covers Loctite, Teroson, Technomelt, Bonderite, and Aquence \u2014 that's a lot of product lines to know deeply. Forza makes adhesives, sealants, tapes, and cleaners. Our chemist answers technical questions on the first call.", "Henkel has no canister spray adhesive system. Loctite covers structural, threadlocking, and CA \u2014 but there is no IC, MC, TC, or RC equivalent in the Henkel catalog. A contractor running Loctite structural adhesive is sourcing their spray adhesive from a completely separate account. Forza covers both from one Iowa manufacturer, one PO, one TDS library."], "landmines": [["On Loctite structural adhesive pricing \u2014 do you know how much of the price reflects Henkel's German parent overhead versus actual manufacturing cost?", "Henkel is a $23B German conglomerate. Pricing reflects European manufacturing, multi-tier US distribution, and conglomerate overhead. Forza is a direct Iowa manufacturer. On equivalent 2-part structural acrylic chemistry, the cost structure difference is measurable."], ["For the bonding tape and surface cleaner your contractors need alongside Loctite structural adhesive \u2014 is Henkel supplying those, or are you managing separate supplier relationships?", "Henkel has no tape product line and no industrial cleaner brand in this category. Every contractor running Loctite is already sourcing tape and cleaner from somewhere else. Forza covers all four from one Iowa account."], ["If Henkel's manufacturing in Germany gets hit with a supply disruption, export restriction, or significant tariff change \u2014 what's your backup for structural adhesive supply?", "Henkel manufactures structural adhesives in Germany. Ocean freight, import tariffs, and European supply chain disruptions are real variables. Forza manufactures in Council Bluffs, Iowa \u2014 one plant, domestic supply chain, no import exposure."], ["If you had a technical question on a Loctite bonding application at 7am on a job site \u2014 who would you call at Henkel, and how quickly would you reach someone who knows that specific application?", "Henkel's technical team covers laundry chemistry, hair care formulations, and aerospace adhesives alongside industrial bonding. Forza's team handles adhesives, sealants, tapes, and cleaners only. The person who picks up at Forza has answered that application question before."], ["When your Technomelt hot melt application runs into a substrate where EVA grades aren't holding \u2014 what's the approval process to switch chemistry, and who owns that decision at Henkel?", "Henkel's Technomelt line spans EVA, PA, and PUR reactive grades \u2014 each with different approval, pricing, and supply chain paths inside a $23B conglomerate. A rep managing multiple Technomelt grades across a production line is navigating Henkel's internal product structure, not just a chemistry decision. Forza's hot melt alternatives are sourced through a single Iowa account with one contact and one lead time."]], "wins": ["Forza R519 is a direct 2-part methacrylate structural adhesive \u2014 same chemistry class as Loctite H8000/H8600/H3300 at direct Iowa manufacturer pricing with no German parent overhead", "RuggedRed industrial surface prep cleaners \u2014 Henkel has no competing cleaner line in this category", "Iowa-made direct manufacturer \u2014 call the chemist, not a call center routing through a $20B German conglomerate", "Forza canister spray adhesive system \u2014 Loctite has no canister spray adhesive"], "moats": ["Loctite threadlockers and retaining compounds \u2014 deeply specced into MRO, no Forza equivalent", "Loctite CA (cyanoacrylate) brand too strong to displace in instant adhesive category", "Teroson OEM transportation tapes/foams/foils \u2014 embedded in vehicle manufacturing specifications", "Henkel aerospace structural adhesives certified into systems Forza does not compete in", "Loctite MS 9650 (new 2025 MS polymer) entering Forza territory \u2014 monitor this development", "Technomelt PUR reactive hot melt line (PUR 508, 4663, 6202, 9300) \u2014 real formulated PUR chemistry with full TDS documentation; do not claim Forza has no PUR competition here"], "crosswalk": [{"sku": "H8000", "app": "Structural bonding: metals, composites, plastics \u2014 multi-substrate", "ind": "R519"}, {"sku": "H8003", "app": "Structural bonding requiring fast fixture \u2014 assembly lines", "ind": "R519"}, {"sku": "H8100", "app": "Cold weather structural bonding, impact-resistant assemblies", "ind": "R519"}, {"sku": "H8600", "app": "Galvanized steel structural bonding \u2014 trailers, panels", "ind": "R519 / T-R785"}, {"sku": "H8610", "app": "Heavy duty galvanized steel \u2014 outdoor/severe environments", "ind": "R519 / T-R785"}, {"sku": "H3300 SpeedBonder", "app": "Automotive structural assembly, multi-substrate bonding", "ind": "R519"}, {"sku": "H4500", "app": "Structural bonding vertical surfaces, non-sag applications", "ind": "R519"}, {"sku": "E-05MR", "app": "Fast structural bonding \u2014 general purpose 5-minute epoxy", "ind": "R160 / R190"}, {"sku": "E-20HP", "app": "High-stress structural bonding requiring elevated temp resistance", "ind": "R160 / R190"}, {"sku": "E-30CL", "app": "Clear structural bonding \u2014 aesthetics-sensitive applications", "ind": "R160"}, {"sku": "401", "app": "Fast bonding dissimilar materials \u2014 general industrial", "ind": "CA1000"}, {"sku": "406", "app": "Plastics bonding: ABS, polycarbonate, rubber", "ind": "CA1500"}, {"sku": "495", "app": "Fast bonding close-fitting metal, plastic, rubber parts", "ind": "CA1000"}, {"sku": "496", "app": "Tight tolerance metal-to-metal bonding", "ind": "CA1000"}, {"sku": "435", "app": "Impact-sensitive assemblies requiring toughened instant adhesive", "ind": "CA1000"}, {"sku": "SI 5900", "app": "Formed-in-place gaskets, engine/equipment sealing", "ind": "OS35 / OS37 / OS45"}, {"sku": "SI 5910", "app": "Sensitive electronics, HVAC, non-corrosive gasketing", "ind": "OS35 / TAC-OS75"}, {"sku": "5920", "app": "High temp gasketing \u2014 copper-colored", "ind": "OS45"}, {"sku": "MS 930NA", "app": "Seam and joint sealing: construction, transportation, marine", "ind": "OS2 / C-OS9 / T-OS151"}, {"sku": "MS 9302", "app": "Interior/exterior joint sealing, fungus-resistant applications", "ind": "OS2 / C-OS9"}, {"sku": "MS 9320 SF", "app": "Automotive sprayable seam sealing, overpaintable", "ind": "T-OS151 / C-OS9"}, {"sku": "MS 9222", "app": "Cargo trailer construction, painted aluminum panel bonding", "ind": "T-OS151 / T-OA156"}, {"sku": "MS 939", "app": "Outdoor joint sealing, UV exposure applications", "ind": "OS2 / C-OS55"}, {"sku": "MS 9381 HPT", "app": "Heavy equipment assembly, primeless bonding", "ind": "T-OS151 / T-OA156"}, {"sku": "MS 9399", "app": "Railroad car, shipbuilding, caravan assembly", "ind": "OS2 / M-OS789"}, {"sku": "MS 650", "app": "Fast skin structural elastic bonding \u2014 transportation", "ind": "T-OA156 / C-OS55"}, {"sku": "PU 8596", "app": "Trailer, bus, RV structural sealing and bonding", "ind": "T-OA156 / T-OS151"}, {"sku": "PU 8598", "app": "High strength trailer/heavy vehicle bonding", "ind": "T-OA156"}, {"sku": "RB 48", "app": "Automotive seam sealing, body shop repair", "ind": "C-OS9"}, {"sku": "Teroson VR 10", "app": "Pre-treatment of substrates prior to Teroson MS polymer sealant", "ind": "T-OSA155 / R-OSA / M-OSA783 / C-OSA"}, {"sku": "Loctite 222 / 242 / 262 / 271", "app": "\u2014 No Forza threadlocker", "ind": "\u2014 No Forza equivalent"}, {"sku": "Loctite 545 / 565 / 567", "app": "\u2014 No Forza pipe sealant", "ind": "\u2014 No Forza equivalent"}, {"sku": "Teroson RB series", "app": "\u2014 Narrow OEM automotive channel", "ind": "\u2014 No Forza equivalent"}, {"sku": "Loctite 4311 / light cure", "app": "\u2014 No Forza light-cure", "ind": "\u2014 No Forza equivalent"}]}, {"id": "ipg", "name": "IPG (Intertape)", "brands": "IPG / Intertape / Cantech / DEWALT Tape / Anchor / American Tape", "hq": "Sarasota, FL / Montreal, QC", "rev": "~$1.5B (2022, private since 2022 \u2014 Clearlake Capital)", "threat": "MOD", "pitch": "IPG (Intertape Polymer Group) is North America's largest independent tape manufacturer \u2014 pressure-sensitive, water-activated, duct, filament, specialty, and packaging tapes across 22 North American facilities. Taken private by Clearlake Capital in a $2.6B leveraged buyout in June 2022. IPG's primary business is packaging tape, stretch film, and e-commerce fulfillment products \u2014 the industrial and specialty tape portfolio is secondary. Forza competes in IPG's industrial, transportation, and construction tape categories with a direct manufacturer advantage and the ability to bundle tape with adhesive and sealant on one account. A $2.6B PE-backed LBO means pricing optimization for investor return \u2014 that pressure gets passed somewhere.", "msgs": [["To the Industrial Distributor", "IPG carries every tape category but nothing outside tape. Forza covers the same tape verticals \u2014 industrial, transportation, construction \u2014 plus adhesive, sealant, and cleaner from one Iowa manufacturer. Better consolidation and better margin: no public company Canadian overhead in the cost."], ["To the Transportation OEM", "IPG's automotive and transportation tapes are solid. Forza T-series covers the same acrylic foam, double-coated, and specialty tape applications at direct pricing with the added benefit of a sealant and adhesive for the same assembly."], ["To the Construction Contractor", "IPG has HVAC, flashing, and construction tape. Forza RC and CC series cover the same construction tape applications as part of a complete sealant and adhesive system from one direct manufacturer."]], "seeds": ["IPG was taken private by Clearlake Capital in a $2.6 billion leveraged buyout in June 2022. That's a significant debt load that Clearlake needs to service and ultimately exit. PE-backed companies in leveraged buyouts optimize pricing to build toward a sale \u2014 that pressure typically surfaces as price increases, SKU rationalization, or distribution changes in years two through four of ownership. IPG is now in that window. Distributors who have built their tape programs around IPG are carrying supply chain risk that didn't exist before 2022.", "IPG's largest revenue category is packaging tape, stretch film, and e-commerce fulfillment products. The industrial and specialty tape lines \u2014 double-coated foam, acrylic foam, HVAC flashing, filament \u2014 are a meaningful but secondary priority. When IPG has a supply constraint or a capacity decision to make, the packaging customers get priority. Forza makes nothing but bonding and sealing products \u2014 adhesive, sealant, tape, and cleaner. The tape line is not secondary to anything.", "The DEWALT tape sold through IPG is a licensed brand \u2014 DEWALT tool quality has nothing to do with IPG tape quality. DEWALT licensed their name to IPG for tape products. A distributor carrying DEWALT tape is selling IPG chemistry under a brand their contractors trust for drills. That brand equity is borrowed and doesn't transfer to tape performance. Forza's tape is what it is \u2014 no licensed name, direct manufacturer, purpose-built for industrial and transportation applications."], "landmines": [["IPG was taken private by Clearlake Capital in a $2.6 billion leveraged buyout in 2022. Has IPG changed pricing, terms, or SKU availability since the Clearlake acquisition \u2014 and do you have a backup tape supplier qualified if that changes further?", "PE leveraged buyouts in the $2B+ range create sustained pressure to optimize margins and prepare for an exit. For IPG that typically means price rationalization on lower-margin SKUs, potential distribution restructuring, and SKU pruning on specialty items that don't scale. Distributors who are heavily concentrated in IPG tape have supply chain exposure that didn't exist before 2022. Qualifying a second tape source is the right move before the next Clearlake-driven pricing adjustment."], ["IPG's primary business is packaging tape and stretch film for e-commerce and fulfillment. When IPG has a supply constraint or production decision, which customer segment do you think gets priority \u2014 the packaging customer or the industrial tape customer?", "IPG's largest revenue categories are carton sealing tape, water-activated tape, and stretch film for the e-commerce and distribution warehouse market. The industrial and specialty tapes \u2014 acrylic foam, double-coated, HVAC flashing \u2014 are a smaller portion of their book. Capacity allocation decisions at a PE-owned company follow revenue concentration. A distributor sourcing industrial tape from IPG is a lower priority than IPG's packaging customers when constraints hit."], ["For the accounts where you're selling tape alongside adhesive and sealant \u2014 are you running IPG tape plus a separate adhesive supplier and a separate sealant supplier on the same job? What does that account complexity cost you?", "IPG makes tape only. No adhesive, no sealant, no cleaner. A distributor building a bonding and sealing program around IPG tape is managing at least two additional supplier relationships for the same application \u2014 adhesive from one source, sealant from another. Forza covers all four categories: tape, adhesive, sealant, and cleaner from one Iowa manufacturer on one PO. The account simplification argument is as strong as the pricing argument."]], "objections": [["IPG has every tape SKU we need", "IPG's tape breadth is real \u2014 22 plants, widest SKU range in North America. The gap isn't SKU coverage, it's system coverage. Forza covers the industrial, transportation, and construction tape categories IPG competes in, plus the adhesive and sealant for the same job on one PO. The consolidation value is what IPG can't match \u2014 not the tape itself."], ["IPG pricing is competitive", "IPG pricing today reflects a $2.6B leveraged buyout from 2022. Clearlake Capital needs a return on that investment \u2014 the pricing trajectory over a 4-6 year PE hold is upward, not downward. Forza is a direct manufacturer with no PE leverage overhead. Compare net landed cost on specific tape grades now, and ask what the IPG pricing conversation looks like in year three of Clearlake's hold."], ["Our contractors know the DEWALT tape brand", "DEWALT tape is IPG tape under a licensed brand name \u2014 DEWALT licensed their name to IPG for tape products. The brand equity comes from DEWALT's tool reputation, not from any connection to DEWALT tool manufacturing or engineering standards. Contractors who trust DEWALT tools are trusting a brand that has nothing to do with the tape they're buying. Forza's tape is direct manufacturer with full TDS data on every SKU \u2014 no borrowed brand name required."], ["We have a strong relationship with IPG", "The relationship is worth preserving where it's working. The question is concentration risk \u2014 a $2.6B LBO creates real supply and pricing uncertainty that didn't exist before 2022. Qualifying Forza as a tape source alongside IPG is insurance, not replacement. Start with the tape categories where Forza competes directly \u2014 industrial bonding tape, acrylic foam, transportation tape \u2014 and build the relationship before you need it."]], "crosswalk": [{"sku": "IPG Double-Coated Foam Tape", "app": "Double-coated foam mounting/bonding tape", "ind": "T215"}, {"sku": "IPG Double-Coated Acrylic Film Tape", "app": "Acrylic film double-coated general bonding", "ind": "T215"}, {"sku": "IPG Acrylic Foam Tape", "app": "Acrylic foam structural attachment", "ind": "T220"}, {"sku": "IPG HVAC Tape / Flashing Tape", "app": "HVAC foil and building flashing tape", "ind": "T305"}, {"sku": "IPG Filament/Strapping Tape", "app": "Fiberglass filament strapping tape", "ind": "T465"}, {"sku": "IPG Duct Tape", "app": "Cloth reinforced duct and utility tape", "ind": "T305"}, {"sku": "IPG High Performance Specialty Tape", "app": "Specialty bonding and masking tape", "ind": "T532"}, {"sku": "IPG Double-Coated Tissue Tape", "app": "Tissue double-coated light duty bonding", "ind": "T205"}, {"sku": "IPG Glass Cloth Tape", "app": "Glass cloth high-temp specialty tape", "ind": "T710"}], "wins": ["Direct manufacturer pricing vs IPG with PE leverage overhead", "Forza single-source: tape + adhesive + sealant on one PO", "No PE ownership risk \u2014 stable manufacturer relationship", "DEWALT brand on IPG tape is a license, not an endorsement", "Forza tape cross in every vertical IPG competes in"], "moats": ["IPG tape breadth is unmatched \u2014 widest SKU range in North America", "Water-activated tape and packaging tape \u2014 outside Forza portfolio", "Stretch and shrink film \u2014 outside Forza portfolio", "DEWALT licensed brand creates pull-through at retail and pro desk", "Scale manufacturing: 22 North American plants drive cost advantage"]}, {"id": "itwplexus", "name": "ITW Plexus", "brands": "Plexus / MA Series / AO Series", "hq": "Glenview, IL", "rev": "ITW $15.9B (2024); Plexus est. <$200M", "threat": "MOD", "pitch": "ITW Plexus is Illinois Tool Works' 2-part methacrylate structural adhesive line \u2014 the specification standard in composite fabrication, transportation OEM, and marine structural bonding. Their MA and AO series are genuinely respected products. The competitive argument isn't about chemistry \u2014 it's about who you're buying from. Plexus routes through ITW's industrial distribution channel with a conglomerate markup built into every price. Forza R519 is a 2-part methacrylate structural adhesive in the same chemistry class, made in Council Bluffs, Iowa, sold direct. And Forza adds the spray adhesive, sealant, and tape that Plexus cannot supply from the same account.", "msgs": [["to the composite fabricator", "Plexus MA300/MA320 is the standard for bonding composite panels to metal frames. Forza R519 is a 2-part methacrylate structural adhesive in the same chemistry class \u2014 primeless adhesion to composites, thermoplastics, and metals \u2014 at direct Iowa manufacturer pricing with full ASTM TDS data."], ["to the marine fabricator", "Plexus AO420 is the go-to for large-area composite structural bonding. Forza R525 covers the same long-open-time 2-part MMA application \u2014 extended working time, very high bond strength, same substrate range. And Forza adds spray adhesive and sealant categories Plexus can't supply from one PO."], ["to the distributor", "Plexus pricing includes ITW's industrial distribution markup on top of a conglomerate cost structure \u2014 that markup doesn't benefit you. Forza R519 is a direct Iowa manufacturer in the same 2-part MMA chemistry class \u2014 better margin structure on the account, plus spray adhesive, sealant, and tape categories Plexus can't supply on one PO."]], "seeds": ["Plexus MA300 and MA420 are the specification standard in composite structural bonding \u2014 that reputation is earned. Forza R519 is a 2-part methacrylate structural adhesive in the same chemistry class: primeless adhesion to composites, thermoplastics, and metals, fast cure, high shear strength. The chemistry isn't the differentiator. The supply chain is. Plexus routes through ITW's industrial distribution with a conglomerate cost structure in every price. Forza is direct from the manufacturer in Council Bluffs. On equivalent chemistry, that difference shows up in the price.", "ITW makes welding equipment, food service machinery, and automotive test instruments. Plexus is one product line among dozens in ITW's Polymers & Fluids segment. When a composite fabricator has a specific bonding application question \u2014 substrate compatibility, cure time under temperature, adhesion to a surface-treated aluminum \u2014 the Plexus rep is the same person managing Devcon epoxy and Fusor body repair. Forza's team makes adhesives, sealants, tapes, and cleaners only. The person who picks up has answered that exact substrate question before.", "Plexus is a structural adhesive-only line. No spray adhesive, no sealant, no tape. A composite fabricator or transportation OEM running Plexus for structural bonding is sourcing all three from separate accounts on every build. Forza R519 covers the same structural MMA chemistry \u2014 and Forza also supplies the canister spray adhesive, the MS polymer sealant, and the bonding tape for the same assembly, from one Iowa manufacturer on one PO. That consolidation argument is worth making before the next Plexus contract renewal."], "landmines": [["For your Plexus structural adhesive \u2014 are you buying direct from ITW or through a distributor? And do you know what the markup layer between ITW's manufacturer price and what you're paying actually is?", "Plexus is sold through industrial distribution \u2014 Grainger, specialty adhesive distributors, and regional industrial supply. Every transaction has a distributor margin between ITW and the end customer. Forza R519 is a direct manufacturer relationship \u2014 no distribution layer, no ITW conglomerate overhead in the price. On equivalent 2-part MMA chemistry, the landed cost difference is worth calculating before the next Plexus reorder."], ["When you have a technical bonding question on a composite application \u2014 substrate prep, cure time, adhesion to a coated surface \u2014 who do you call at Plexus, and how quickly do you reach someone who specializes in that specific application?", "ITW routes technical support through their industrial distribution channel. Plexus is one product line in ITW's Polymers & Fluids segment, which also covers Devcon epoxy and Fusor automotive repair. The person answering may or may not have composite bonding as their primary expertise. Forza's technical team handles adhesives, sealants, tapes, and cleaners only \u2014 the chemist who made R519 is reachable directly in Council Bluffs."], ["For the spray adhesive, sealant, and bonding tape your fabricators need on the same assembly where they're using Plexus structural adhesive \u2014 is ITW supplying those, or are you managing separate supplier relationships for each?", "Plexus makes structural adhesive. No canister spray, no sealant, no bonding tape. A composite fabricator running Plexus MA-series for structural bonding is already buying all three from other suppliers on every build. Forza covers all four categories from one Iowa manufacturer on one PO \u2014 structural MMA, spray adhesive, MS polymer sealant, and tape. That's the consolidation conversation worth having before the next account review."]], "objections": [["Plexus is specced into our build process", "Specs are written around chemistry and performance, not brand. Forza R519 is a 2-part methacrylate structural adhesive with primeless adhesion to composites, thermoplastics, and metals \u2014 same chemistry class as Plexus MA-series. Pull the spec: if it calls for a 2-part MMA with specific tensile and overlap shear values, R519 meets those criteria. Get us a sample order on a non-critical assembly and put the TDS side by side before the next spec review."], ["We've used Plexus for ten years without a problem", "Ten years of reliable bonding is the right foundation to build on \u2014 not the right reason to avoid a price comparison. Forza R519 covers the same 2-part methacrylate structural chemistry. The reliability question is answered by the TDS and a trial application. The pricing question is answered by comparing landed cost on your current Plexus reorder against a direct manufacturer quote. Both conversations are worth having before the next contract renewal."], ["Plexus has better technical support through ITW", "ITW's technical infrastructure is real. So is Forza's direct manufacturer access \u2014 when you call Forza, you reach the chemist in Council Bluffs who formulated R519, not a distributor rep routing your question to an ITW product manager. For a composite bonding question at 7am before a production run, direct access to the formulator is faster and more specific than a support ticket through an industrial distribution channel."], ["We can't risk switching structural adhesive mid-project", "Correct \u2014 don't switch mid-project. The right time is a parallel validation run on a non-critical assembly before the next contract period. Get a sample of R519, run it against your current Plexus spec on test substrates, verify the overlap shear and tensile against the TDS, and qualify it on your own timeline. Forza provides the TDS data and technical support for the validation. The switching decision stays with you."]], "crosswalk": [{"sku": "Plexus MA300", "app": "2-part MMA structural: metals, composites, plastics \u2014 18 min work life", "ind": "R519"}, {"sku": "Plexus MA310", "app": "2-part MMA medium cure high stiffness structural bonding", "ind": "R519"}, {"sku": "Plexus MA320", "app": "2-part MMA high strength, cold temp impact resistant structural", "ind": "R519"}, {"sku": "Plexus MA420", "app": "2-part MMA fast cure direct-to-metal structural bonding", "ind": "R519"}, {"sku": "Plexus MA205HV", "app": "2-part MMA rapid cure composites and electronics structural", "ind": "R519"}, {"sku": "Plexus AO420", "app": "2-part MMA composite bonding transportation and marine", "ind": "R519 / R525"}, {"sku": "Plexus AO610", "app": "2-part MMA galvanized metal structural bonding", "ind": "R519"}], "wins": ["Forza R519 is a direct 2-part methacrylate structural adhesive \u2014 same chemistry class as Plexus MA-series at direct Iowa manufacturer pricing with no ITW distribution markup", "Forza R525 covers long-open-time large-area structural bonding where Plexus AO420 is specified \u2014 extended working time, very high bond strength", "Forza single-source: R519/R525 structural MMA + OS2 sealant + tape on one account \u2014 Plexus is structural adhesive only", "No ITW distribution markup \u2014 direct manufacturer vs Plexus routing through ITW's industrial distribution channel", "Forza canister spray system (IC-series) \u2014 Plexus has zero spray adhesive capability"], "moats": ["Plexus brand deeply embedded in transportation OEM composite specs", "MA300/MA320 series primerless adhesion to Alodined aluminum \u2014 aerospace spec", "No Forza equivalent for ultra-high-performance structural bonding on aerospace substrates", "ITW engineering support and application testing infrastructure"]}, {"id": "manus", "name": "Manus Products", "brands": "Manus-Bond STP / Silicone / PU", "hq": "Waconia, MN (3 facilities: MN x2, FL)", "rev": "Independent / Private", "threat": "MODERATE-HIGH", "pitch": "Manus Products is a 65-year Waconia, Minnesota sealant and adhesive manufacturer \u2014 ISO 9001:2015 certified, three facilities, 30+ STP polyether sealant variants in their 75-AM family. The closest structural analog to Forza among all 21 competitors: independent Midwest manufacturer, same channels, same contractors, similar credibility story. The competitive argument isn't about quality \u2014 Manus makes good product. It's about breadth. Manus makes sealants, tapes, and adhesives. Manus makes zero canister spray adhesive and zero industrial surface prep cleaner. Forza makes all four. The single-source argument is the sharpest edge against Manus \u2014 and it's the one that Manus structurally cannot answer.", "msgs": [["To the Construction Contractor", "Manus 75-AM and Forza OS2/C-OS9 are both STP polyether sealants. Same chemistry. Forza also supplies bonding tape and surface cleaner for the same job. Manus cannot."], ["To the Transportation Fabricator", "Manus 75-AM-HV and Forza T-OA156 are both high green strength STP for transportation assembly. Forza also supplies bonding tape and spray adhesive for the same build. Manus makes neither."], ["To the Distributor", "You carry Manus for sealant. Your customer still needs bonding tape and cleaner from a second supplier. Forza fills all four from one Iowa manufacturer \u2014 better shelf consolidation, better margin structure with no Midwest regional overhead built into the cost."]], "objections": [["Manus 75-AM is what we have always used", "75-AM is a legitimate STP polyether sealant with 30+ years of field history in construction and transportation. Forza OS2 and C-OS9 are the same chemistry class. The switching conversation on sealant chemistry is low friction \u2014 but it's also not the first conversation. The first conversation is canister spray adhesive and surface cleaner, which Manus doesn't make. Add Forza for those two categories first. The sealant comparison follows on its own when the account relationship is established."], ["Manus has more sealant variants than Forza", "Correct \u2014 the 75-AM family's 30+ variants is deeper than Forza's STP sealant count in any single category. That depth matters when a contractor needs a very specific variant \u2014 NSF-61 potable water, self-leveling, very low modulus SIP panel. Where Manus has the specific variant a contractor needs, Forza doesn't always have a direct match. The argument isn't sealant variant depth. It's system breadth: canister spray adhesive and industrial cleaner that Manus structurally cannot supply."], ["Manus is ISO certified and we trust their quality", "Manus's ISO 9001:2015 certification and 65-year track record are real \u2014 the trust is earned. Forza manufactures from a single Council Bluffs facility with the same quality focus, though without a public ISO certification. The quality argument is a push, not a Forza win. The wins are structural: spray adhesive and cleaner that Manus doesn't make, and single-source capability across all four categories from one manufacturer account."], ["We don't need a spray adhesive \u2014 we only buy sealant from this supplier", "That's exactly the opening. If your sealant supplier is Manus and your spray adhesive is coming from someone else, Forza consolidates both on one account. Spray adhesive is where Forza enters \u2014 not to displace the Manus sealant relationship, but to add the category Manus can't serve. Once Forza is on the account for adhesive, the sealant comparison happens naturally. The consolidation saves the contractor a supplier relationship and saves you a vendor to manage."]], "seeds": ["Manus is the most honest competitive conversation in the Forza book \u2014 they're a legitimate independent Midwest manufacturer with 65 years of chemistry credibility, ISO 9001 certification, and a 30+ variant STP polyether sealant family that is genuinely deep. The 75-AM family competes directly with Forza OS2 and C-OS9 on chemistry. Don't undersell Manus to a contractor who knows them \u2014 it will cost credibility. The argument is one thing and one thing only: Manus makes no canister spray adhesive and no industrial surface prep cleaner. Every contractor running Manus on a full bonding job is sourcing both from somewhere else. Forza covers all four from one Iowa manufacturer on one PO.", "Manus's 75-AM STP polyether family has over 30 variants \u2014 all-purpose, fast cure, fast skinning, high green strength, marine, concrete, NSF-61, UL listed, self-leveling. That's genuine product depth in one chemistry category. Forza's sealant portfolio is broader across verticals but narrower in variant count within any single category. The argument against Manus is never about sealant depth \u2014 it's about what surrounds the sealant on the same job. Canister spray adhesive: zero from Manus. Industrial surface prep cleaner: zero from Manus. Bonding tape: Manus has tape but no purpose-built industrial system. Forza covers all four.", "Manus is ISO 9001:2015 certified, runs three facilities across Minnesota and Florida, and does custom color matching. That's a real quality and service story \u2014 one that mirrors the Forza pitch in several ways. The distinction: Manus focuses on sealants and adhesives. Forza focuses on adhesives, sealants, tapes, and cleaners. On any account where a contractor needs all four categories for the same job, Manus requires at least one additional supplier. Forza doesn't. That's the conversation."], "landmines": [["For the canister spray adhesive and industrial surface cleaner your contractors need alongside Manus sealant and tape on the same bonding job \u2014 is Manus supplying those, or are you managing separate supplier accounts for each?", "Manus makes sealants, tapes, and adhesives \u2014 no canister spray adhesive system and no industrial surface prep cleaner. This isn't a knock on Manus's quality; it's a structural product line gap. Every contractor running Manus 75-AM sealant on a construction or transportation application still needs canister spray adhesive and a surface cleaner for the same job. Forza covers all four from one Iowa manufacturer on one PO. That consolidation saves the contractor and the distributor a supplier relationship."], ["Manus has been in business for 65 years with ISO 9001 certification and three facilities. In that time, have they added a canister spray adhesive system or an industrial surface prep cleaner to their product line?", "65 years is a long time to evaluate a product expansion decision. Manus has stayed in their lane \u2014 sealants, adhesives, tapes \u2014 and done it well. That focus is their strength and their ceiling. A distributor who has built their sealant program around Manus is getting excellent sealant. They are also accepting a structural gap in spray adhesive and cleaner that Manus has had 65 years to fill and hasn't. Forza fills both gaps on the same manufacturer account."], ["Manus makes sealants, tapes, and adhesives \u2014 they've been doing it for 65 years. In that time, has a contractor ever asked Manus to supply the canister spray adhesive or the industrial surface cleaner for the same job? And what did Manus say?", "Manus's product scope has been consistent for 65 years: sealants, tapes, and adhesives. No canister spray system, no industrial surface prep cleaner \u2014 not because of quality or capability, but because that's the business they chose to build. A contractor who has ever needed spray adhesive alongside their Manus sealant already knows the answer. Forza fills both gaps on the same Iowa manufacturer account, without displacing the Manus sealant relationship if that's where the loyalty sits."]], "wins": ["Forza makes canister spray adhesives \u2014 Manus makes ZERO", "Forza makes industrial surface prep cleaners (RuggedRed) \u2014 Manus has no cleaner line", "Manus has a marine sealant (77-MA, \u2265400 psi tensile, Shore A 58) but no marine spray adhesive or bonding tape \u2014 Forza's ForzaSeal M-OS789/M-OS796, ForzaBond M-OA755, and marine tape line covers the full marine system that Manus cannot match", "Single-source: four categories vs. Manus sealant + tape (no spray adhesive, no cleaner)", "Forza six-vertical purpose-built chemistry vs. Manus construction/industrial/transportation focus"], "moats": ["Manus butyl tape line for HVAC gasketing and transportation \u2014 Forza butyl tape is narrower", "Manus 65-year Midwest construction relationships \u2014 approach from spray adhesive and cleaner side", "Manus private label manufacturing \u2014 some distributor house brands may be Manus chemistry", "ISO 9001:2015 and custom color capability \u2014 differentiated service for specification accounts", "77-MA marine sealant \u2014 documented spec sheet, \u2265400 psi tensile, \u2265200% elongation, Shore A 58\u00b13, rated to 285\u00b0F short-term; real marine sealant, do not claim no marine products"], "crosswalk": [{"sku": "75-AM", "app": "General industrial, construction, transportation sealing and bonding", "ind": "OS2 / C-OS9 / C-OS55"}, {"sku": "75-AM-HV", "app": "Transportation vehicle assembly, panel bonding, high initial tack applications", "ind": "T-OA156 / T-OS151"}, {"sku": "75-AM-FS", "app": "Transportation seam sealing requiring rapid skin formation", "ind": "T-OS151 / C-OS9"}, {"sku": "75-AM-FC", "app": "Fast cure construction and transportation sealing", "ind": "T-OS151 / C-OS9"}, {"sku": "75-AM-XX", "app": "Exterior joint sealing with UV exposure \u2014 facades, window perimeters", "ind": "C-OS55 / T-OS151"}, {"sku": "75-AM-XHG", "app": "High grab construction and assembly adhesive sealant", "ind": "T-OA156 / C-OS9"}, {"sku": "75-AM-UHVFC", "app": "Transportation ultra high viscosity, fast cure bonding", "ind": "T-OA156"}, {"sku": "75-AM-UL", "app": "UL listed applications \u2014 industrial and construction", "ind": "OS2 / C-OS9"}, {"sku": "75-AM-NSF61", "app": "Potable water contact applications \u2014 piping, tanks, fixtures", "ind": "OS2"}, {"sku": "75-AM-LOT", "app": "Long open time potable water applications", "ind": "OS2"}, {"sku": "75-AM-SG", "app": "Spray application of STP sealant \u2014 large area sealing", "ind": "T-OS151 / C-OS9"}, {"sku": "75-AM-SG-SS", "app": "Structural insulated panel spray sealing", "ind": "T-OS151"}, {"sku": "75-AM-SS", "app": "SIP panel sealing \u2014 building envelope", "ind": "C-OS9 / C-OS55"}, {"sku": "75-AM-SS-FC", "app": "SIP panel sealing \u2014 fast cure production", "ind": "C-OS9"}, {"sku": "75-AM-MA-XX", "app": "Marine sealing and bonding: boat decks, hulls, fittings", "ind": "M-OS789 / M-OS796"}, {"sku": "75-AMUC-XX", "app": "Clear sealant applications \u2014 glass, windows, visible joints", "ind": "OS2 / C-OS55"}, {"sku": "75-AMC", "app": "Concrete expansion joints, pavement sealing, construction", "ind": "C-OS9 / C-OS55"}, {"sku": "75-AMC-XC", "app": "High performance construction joint sealing", "ind": "C-OS9 / C-OS55"}, {"sku": "75-AMCTX-X", "app": "Textured/rough surface construction sealing", "ind": "C-OS9"}, {"sku": "75-AMC-SS-VLM", "app": "Very low modulus SIP panel sealing", "ind": "C-OS55"}, {"sku": "75-GP / 75-GP-TX", "app": "General purpose STP sealing \u2014 multi-substrate", "ind": "OS2 / C-OS9"}, {"sku": "76-AM", "app": "Horizontal joint sealing \u2014 self-leveling format", "ind": "C-OS9"}, {"sku": "76-AMC-JS", "app": "Concrete construction self-leveling joint sealing", "ind": "C-OS9"}, {"sku": "76-AMC-PPS", "app": "Roofing pitch pocket filling \u2014 pourable grade", "ind": "C-OS9"}, {"sku": "76-AM-VaPerm", "app": "Air and vapor barrier sealing \u2014 building envelope", "ind": "C-OS9 / C-OS55"}, {"sku": "77-AMP", "app": "Transportation and industrial PU bonding/sealing", "ind": "T-OA156 / T-OS151"}, {"sku": "77-HR", "app": "Transportation modified PU sealing and bonding", "ind": "T-OA156 / T-OS151"}, {"sku": "78-RC", "app": "Hybrid sealant for construction and industrial", "ind": "OS2 / C-OS9"}, {"sku": "78-FA", "app": "Hybrid sealing and bonding applications", "ind": "OS2 / C-OS9"}, {"sku": "34-HP", "app": "Window/door/fenestration sealing, food processing", "ind": "OS2 / C-OS9"}, {"sku": "35-MP", "app": "Window glazing and assembly sealing", "ind": "C-OS9 / C-OS55"}, {"sku": "25-AM", "app": "High strength bonding and sealing \u2014 multi-surface", "ind": "T-OA156 / C-OS9"}, {"sku": "PermFlash LF", "app": "Window and door flashing tape/sealant systems", "ind": "C-OS9 / C-OS55"}, {"sku": "73-A", "app": "Food processing, medical, general industrial silicone", "ind": "OS35 / OS45"}, {"sku": "73-GP", "app": "General industrial and construction silicone sealing", "ind": "OS35 / TAC-OS75"}, {"sku": "75-A", "app": "General purpose silicone, multi-surface", "ind": "OS35"}, {"sku": "33-MS", "app": "General construction sealing \u2014 ASTM C920", "ind": "OS2 / C-OS9"}, {"sku": "FW-15-NS", "app": "Structural bonding: ceramics, metal, glass, concrete \u2014 no primer required", "ind": "R160 / OA300"}, {"sku": "65-B", "app": "Neoprene bonding, gasket sealing, general contact adhesive applications", "ind": "RC863"}, {"sku": "Butyl line (501-A, 64A-MBG, 50A-HV)", "app": "Building envelope butyl sealing and glazing tape", "ind": "\u2014 No Forza butyl"}, {"sku": "Acrylic latex line (67-A series)", "app": "General purpose paintable caulking \u2014 residential and light commercial", "ind": "\u2014 No Forza latex"}, {"sku": "Foam sealant line", "app": "Window and door installation foam sealing", "ind": "\u2014 No Forza foam sealant"}, {"sku": "Co-polymer 27-A", "app": "Federal specification construction sealing", "ind": "\u2014 No Forza co-polymer"}]}, {"id": "newstar", "name": "NewStar Adhesives", "brands": "EverStrong / EverHold / EverBond", "hq": "Massachusetts", "rev": "Independent / Private", "threat": "MODERATE", "pitch": "NewStar Adhesives is a privately held canister spray adhesive company headquartered in Weston, Massachusetts (31 Silver Hill Road) with manufacturing operations in Georgia. Estimated $6M revenue. CEO Tom Kell. Their tagline is 'We do one thing and we do it well.' EverStrong (industrial), EverHold Nautical (marine), and EverBond are their primary brands. In October 2018, NewStar announced adhesive products for Panolam Surface Systems' Nevamar and Pionite high-pressure laminate brands \u2014 confirming the private label relationship. The Nevamar and Pionite laminate channels are key distribution points for NewStar chemistry under those brand names. No sealant, no bonding tape, no industrial cleaner \u2014 by design and by explicit self-description.", "msgs": [["To the Industrial Contractor", "EverStrong is a solid spray adhesive. The moment you need sealant, tape, or cleaner for the same job, you are calling someone else. ForzaBond covers the same applications, Iowa-made, and gives you the rest from one manufacturer."], ["To the Distributor", "You carry NewStar for adhesive. You have no sealant, tape, or cleaner to put next to it. Forza fills all four categories \u2014 and the margin structure is better. No multi-plant regional operation overhead, buying direct from the Iowa manufacturer."]], "objections": [["EverStrong is what we have always used", "EverStrong's consistency over time is what built the loyalty \u2014 and Forza IC/MC-series covers the same substrates in the same canister delivery format. The chemistry comparison is close. The argument isn't to replace EverStrong on adhesive grounds \u2014 it's to replace the two or three other supplier relationships that exist because NewStar doesn't make sealant, tape, or cleaner. Add Forza for those categories. The adhesive conversation follows naturally."], ["NewStar's canister return program saves us money", "Returnable canisters require scheduling return freight, tracking canister inventory, and coordinating pickup \u2014 logistics overhead that doesn't show up in the per-unit price. Forza ships standard \u2014 no return program, no return freight scheduling, no canister tracking. Calculate the total cost of the return program including logistics labor and coordination time before assuming the per-unit saving survives the full cost comparison."], ["NewStar specializes in adhesive \u2014 that focus is better", "NewStar's specialization is genuine and it shows in their product quality. Forza's adhesive line has been in market since 1979 \u2014 the same depth of specialty focus across IC, MC, TC, and RC series for each vertical. The difference is what surrounds the adhesive: Forza adds sealant, tape, and cleaner that NewStar chose not to make. Specialization in one category is NewStar's strength. System breadth across four categories is Forza's."]], "seeds": ["NewStar's tagline is 'We do one thing and we do it well.' That's an honest company \u2014 they make canister spray adhesive and they're good at it. The EverStrong ES-series and EverHold Nautical N-series are well-formulated products with real loyalty in industrial woodworking, manufactured housing, and marine fabrication. The argument against NewStar is literally in their own tagline: one thing. Sealant: zero. Bonding tape: zero. Industrial cleaner: zero. Every contractor buying EverStrong needs all three from somewhere else on the same job. Forza does four things well \u2014 including the one NewStar does.", "NewStar manufactures across multiple plants in Massachusetts, Georgia, and North Carolina. Three-state multi-plant manufacturing introduces batch consistency variability that single-facility manufacturers don't have. Forza manufactures from a single Council Bluffs, Iowa facility \u2014 one batch standard, one quality control process, one technical team answering questions about every production run. For a contractor whose production line depends on consistent adhesive performance batch to batch, that's a meaningful difference.", "NewStar's private label relationship is confirmed by their own press release: in October 2018 they announced adhesives for Panolam Surface Systems' Nevamar and Pionite high-pressure laminate brands \u2014 NewStar chemistry under Panolam's brand names in the laminate distribution channel. That's a legitimate distribution strategy, but it means distributors who carry Nevamar or Pionite laminate adhesive may unknowingly be carrying NewStar chemistry under a Panolam brand. The laminate channel loyalty is to the surface brand, not to NewStar. Forza IC-series covers the same HPL bonding application in the same canister format, with the addition of sealant, tape, and cleaner on the same manufacturer account."], "landmines": [["For the sealant, bonding tape, and industrial cleaner your contractors need alongside NewStar EverStrong or EverHold on the same job \u2014 is NewStar supplying those, or are you managing separate accounts for each?", "NewStar makes canister spray adhesive and adhesive removers. No sealant, no bonding tape, no industrial cleaner \u2014 by design. Their tagline confirms it: one thing. A contractor running EverStrong for industrial bonding or EverHold for marine fabrication is sourcing sealant, tape, and cleaner from at least two additional supplier relationships on every build. Forza covers all four from one Iowa manufacturer on one PO. The consolidation replaces multiple vendor relationships with one."], ["NewStar manufactures across three states \u2014 Massachusetts, Georgia, and North Carolina. Has batch-to-batch consistency been a factor in any quality or application issues on any of your accounts?", "Multi-plant manufacturing across three geographically dispersed facilities introduces variability in raw material sourcing, batch chemistry, and quality control procedures. Different plants may have different production equipment, different operators, and different environmental controls. Forza manufactures from a single facility in Council Bluffs, Iowa \u2014 one batch standard, one QC process, one technical team. For a production operation that depends on consistent adhesive behavior, the single-facility advantage is measurable."], ["For marine applications that need more than spray adhesive \u2014 sealant for hull seams, bonding tape for cabin assembly, surface cleaner for prep \u2014 is NewStar EverHold able to supply those alongside the adhesive?", "EverHold Nautical covers marine spray adhesive well. But a marine fabricator needs sealant for hull seams and through-hull fittings, bonding tape for cabin and upholstery assembly, and surface cleaner for substrate prep on every build. NewStar cannot supply any of those. Forza covers ForzaBOND MC-series marine spray adhesive, ForzaSeal M-OS789 marine sealant, ForzaTape, and RuggedRed surface cleaner from one Iowa manufacturer on one marine account."]], "wins": ["Single-source: Forza supplies 4 categories vs. NewStar adhesive + cleaner only \u2014 no sealant, no tape", "Iowa-made direct manufacturer vs. NewStar MA/GA/NC multi-plant operation", "ForzaBOND covers every EverStrong application with purpose-built vertical chemistry", "Forza marine: ForzaBOND MC-series + ForzaSeal M-OS789 \u2014 full system vs. NewStar EverHold adhesive only", "No canister return logistics dependency with Forza"], "moats": ["EverHold Nautical established in marine fabrication shops \u2014 approach from sealant and tape side", "EverStrong brand recognition in industrial woodworking and manufactured housing channels", "EverBond/EverStrong sometimes sold private label \u2014 some distributor accounts may be brand-loyal without knowing it is NewStar", "ES10 ZERO (zero VOC) and CA-compliant options throughout EverStrong line"], "crosswalk": [{"sku": "ES10+ / ES10 ZERO (zero VOC)", "app": "Industrial contact adhesive: foam, fabric, laminates", "ind": "IC933 / IC936"}, {"sku": "ES20 / ES25", "app": "Industrial high-strength canister contact adhesive", "ind": "IC933"}, {"sku": "ES36 High Temp", "app": "Industrial high-temp canister contact adhesive", "ind": "IC934 / IC946"}, {"sku": "ES55 / ES60 / ES80", "app": "Industrial HPL, laminate, panel bonding", "ind": "IC946 / IC947"}, {"sku": "ES40 EPS Foam", "app": "EPS / polystyrene foam bonding \u2014 styrene safe", "ind": "IC947"}, {"sku": "ES91 Infusion / Composite", "app": "Composite infusion and mold bonding", "ind": "IC947"}, {"sku": "ES99 / ES99 LVoc", "app": "Industrial heavy substrate specialty bonding", "ind": "IC946 / IC947"}, {"sku": "ES2014", "app": "Industrial canister adhesive \u2014 high performance", "ind": "IC946"}, {"sku": "ESWG / ESYG Interior Wood Glue", "app": "Interior wood assembly glue", "ind": "OA4"}, {"sku": "Mean Green Water-Based", "app": "Water-based contact adhesive", "ind": "OA4"}, {"sku": "FDA Fast Dry Adhesive", "app": "Fast dry industrial
